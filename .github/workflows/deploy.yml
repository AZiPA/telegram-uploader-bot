name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Missing repository secret TGCLOUD_TOKEN"
            exit 1
          fi

          CLI="./node_modules/.bin/tgcloud"

          $CLI push --force
          $CLI migrate --safe
          $CLI webhook sync

      - name: Post-Deploy Hook (Seed Owner)
        env:
          OWNER_ID: ${{ secrets.OWNER_ID }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$OWNER_ID" ]; then
            echo "ℹ️ No OWNER_ID secret provided. Bot deployed in Zero-State (awaits manual /setbotowner)."
            exit 0
          fi

          CLI="./node_modules/.bin/tgcloud"
          PAYLOAD="{\"text\":\"/setbotowner\",\"from\":{\"id\":$OWNER_ID},\"chat\":{\"id\":$OWNER_ID,\"type\":\"private\"}}"
          $CLI run handlers/message "$PAYLOAD"
