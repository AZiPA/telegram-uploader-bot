name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Missing repository secret TGCLOUD_TOKEN"
            exit 1
          fi

          CLI="./node_modules/.bin/tgcloud"

          $CLI status
          $CLI push --force
          $CLI migrate --safe
          $CLI webhook sync
